product:
  name: wayspot
  mission: >
    Make application launching on Hyprland feel immediate, then provide a small
    set of pleasant desktop utilities without compromising that fast path.

principles:
  picker_latency:
    priority: primary
    invariant: >
      The zero-argument application picker remains a direct fresh-process path;
      unrelated product modes do not add work to its startup critical path.
  derived_state:
    invariant: >
      External desktop facts are discovered from their current authorities when
      needed rather than persisted as Wayspot-owned indexes or caches.
    product_owned_persistence:
      - retained notification history
  resident_cost:
    invariant: >
      Features that require residency keep idle CPU, memory, retained state,
      and lifecycle complexity bounded and measured.

scope:
  binary: wayspot
  platform:
    compositor: Hyprland
    display: Wayland
    other_compositors: excluded

  interfaces:
    gui:
      purpose: interactive desktop picker
    cli:
      purpose: direct access to current product actions
    bash:
      entry: source <(wayspot completion bash)

  modes:
    apps:
      default: true
      purpose: discover, find, and open currently installed applications
      resident_process: false
      persistent_derived_state: false
    notifications:
      purpose: receive, show, close, and retain desktop notifications
      retention: 30 days
      resident_process: true
      persistent_product_state:
        - notification history
    wallpaper:
      purpose: discover, show, and rotate monitor wallpapers
      resident_process: true
      persistent_derived_state: false
      invariants:
        - monitor focus never changes the current wallpaper round
        - each process start receives a fresh random sequence
        - the process remains alive while the desktop session is alive

  process_lifecycle:
    - each resident process owns and asserts its lifecycle
    - no resident launcher process
    - no fallback process manager

excluded:
  - persistent application or icon indexes
  - generic framework or plugin systems
  - generic compositor abstraction
  - support for compositors other than Hyprland
