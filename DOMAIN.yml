product:
  name: wayspot
  mission: >
    Make application launching on Hyprland feel immediate, then provide a small
    set of pleasant desktop utilities without compromising that fast path.

principles:
  picker_latency:
    priority: primary
    invariant: >
      Both the direct zero-argument picker and the resident summon discover
      applications fresh. Unrelated capabilities do not add startup work.
  derived_state:
    invariant: >
      External desktop facts are discovered from their current authorities when
      needed rather than persisted as Wayspot-owned indexes or caches.
    product_owned_persistence:
      - retained notification history
  resident_cost:
    invariant: >
      Features that require residency keep idle CPU, memory, retained state,
      and lifecycle complexity bounded and measured.

scope:
  binary: wayspot
  platform:
    compositor: Hyprland
    display: Wayland
    other_compositors: picker_notifications_wallpaper_via_wayland_layer_shell

  interfaces:
    gui:
      purpose: interactive desktop picker
      wayland_role: centered overlay layer with exclusive keyboard interactivity
    cli:
      purpose: direct access to current product actions
    bash:
      entry: source <(wayspot completion bash)

  modes:
    apps:
      default: true
      purpose: discover, find, and open currently installed applications
      resident_process: false
      persistent_derived_state: false
      header:
        toolbar: clock plus on-demand StatusNotifier item icons
        clock: 24-hour local date and time, updated while open
        presentation: existing picker window; no separate desktop bar
        tray_discovery: after first useful picker frame
        tray_refresh: bounded, while picker is open
      window_finder:
        surface: same picker rows, mutually exclusive with application results
        activation: Tab after the first useful application frame
        primary_input: keyboard
        scope: global current windows across workspaces and monitors
        hierarchy: flat; workspace and monitor are location metadata
        ordering: compositor-provided local focus history with deterministic fallback
        location_metadata:
          - workspace id
          - workspace-local geometry ordinal when multiple windows share a workspace
        filtering: current window identity, title, workspace, and monitor metadata
        icon_identity: one exact unambiguous desktop-application id match only
        authority: exact native Hyprland or Snowman CLI
        discovery: bounded hyprctl clients snapshot or Snowman mapped windows and local seat MRU per activation; maximum 128 windows
        mutation: exact Hyprland address with activewindow verification; Snowman exact ID after surface destruction and bounded Wayland sync, verified applied receipt; no fallback or retry
        resident_process: false
        persistent_derived_state: false
    notifications:
      purpose: receive, show, close, and retain desktop notifications
      presentation: noninteractive top-right layer without exclusive zone
      retention: 30 days
      resident_process: true
      persistent_product_state:
        - notification history
    wallpaper:
      purpose: discover, show, and rotate monitor wallpapers
      output_authority: wl_output mode and transform plus layer configure logical size
      presentation: persistent layer-shell surface plus wp_viewporter per output on one Wayland connection
      rotation_scope: XDG_RUNTIME_DIR plus WAYLAND_DISPLAY
      independent_headless_acceptance: Snowman two-output and zero-output reconciliation
      resident_process: true
      persistent_derived_state: false
      invariants:
        - rotation replaces immutable buffers, never healthy output surfaces
        - output add/remove affects only the corresponding surface
        - unchanged configure, focus and input never republish wallpaper
        - zero outputs suspend the hourly timer; return performs at most one due rotation
        - each process start receives a fresh random sequence
        - the process remains alive while the desktop session is alive

    tray:
      purpose: retain StatusNotifierWatcher D-Bus registration ownership
      resident_process: true
      interface: KDE and freedesktop StatusNotifierWatcher; D-BusMenu actions
      presentation: icons and menus only in the existing picker toolbar
      persistent_derived_state: false

  resident:
    entry: wayspot resident CONFIG
    configuration: strict startup JSON; picker, notifications, tray booleans; wallpaper absolute directory or null
    control: same-UID session-scoped bounded seqpacket listener
    commands: [wayspot resident status, wayspot picker, wayspot picker dismiss, wayspot wallpaper rotate]
    lifecycle: one sequential owner; individually enabled capabilities; no derived picker state while hidden
    graphical_lifetime: one SDL owner, independent surface leases
    external_effects: bounded tray fetch worker; synchronous image and CLI/menu effects remain
    compatibility: standalone commands retained; competing owners refused
  process_lifecycle:
    - the foreground session child owns and asserts its lifecycle
    - no extra resident launcher process
    - no fallback process manager

excluded:
  - persistent application or icon indexes
  - generic framework or plugin systems
  - generic compositor abstraction
  - additional compositor-specific window finder backends without accepted native operations
